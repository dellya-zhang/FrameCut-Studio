name: Video pipeline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up --build --detach --wait --wait-timeout 90
      - run: curl --fail http://127.0.0.1:8501/_stcore/health
      - run: docker compose exec -T studio tesseract --list-langs
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: framecut
          POSTGRES_PASSWORD: framecut-test
          POSTGRES_DB: framecut
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U framecut -d framecut"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
        env:
          FRAMECUT_DATABASE_URL: postgresql://framecut:framecut-test@127.0.0.1:5432/framecut
